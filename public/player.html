<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Makers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Makers player. Plays a YouTube video with Makers' own controls and none of YouTube's overlays.
     Used by the website (iframe on /projects/:id) and by the iOS app (WebView), so both look the same.
     The YouTube frame is taller than the visible area: the video sits in the middle, and YouTube's
     title bar, logo and pause shelf fall into the hidden strips above and below. */
  :root { --accent: #F2B33D; --on-accent: #0B0A08; --text: #F3EFE7; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--text);
    font-family: 'Readex Pro', system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; background: #000; transform-origin: 0 0; }
  #clip { position: absolute; overflow: hidden; z-index: 1; }
  #clip iframe, #yt { position: absolute; left: 0; border: 0; }
  .layer { position: absolute; inset: 0; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #cover { z-index: 3; pointer-events: none; transition: opacity .4s ease; }
  #cover .shade { position: absolute; inset: 0; background: rgba(0,0,0,.32); }
  #cover .start { position: absolute; bottom: 14px; display: flex; align-items: center; gap: 10px; }
  [dir=rtl] #cover .start { right: 16px; } [dir=ltr] #cover .start { left: 16px; }
  #cover .start b { font-weight: 600; font-size: 15px; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .disc { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  #veil { z-index: 2; opacity: 0; transition: opacity .3s ease; pointer-events: none; }
  #veil .bg { filter: blur(26px) brightness(.45); transform: scale(1.15); }
  #veil.on { opacity: 1; }
  #blocker { z-index: 4; display: none; }
  #ui { z-index: 5; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  #ui.on { opacity: 1; }
  #ui.on .hit { pointer-events: auto; }
  #center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; border: 0; padding: 0;
    border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 12px 10px; display: flex; align-items: center; gap: 10px; direction: ltr;
    background: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,0)); }
  .btn { width: 34px; height: 34px; border: 0; padding: 0; background: none; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  #time { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; opacity: .9; white-space: nowrap; flex: none; }
  #seek { flex: 1; min-width: 40px; height: 22px; margin: 0; background: none; -webkit-appearance: none; appearance: none; cursor: pointer; }
  #seek::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p, 0%), rgba(243,239,231,.3) var(--p, 0%)); }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%; background: var(--accent); border: 0; }
  #seek::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(243,239,231,.3); }
  #seek::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--accent); }
  #seek::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--accent); border: 0; }
  #spin { z-index: 5; position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
    border: 3px solid rgba(243,239,231,.25); border-top-color: var(--accent); animation: spin .8s linear infinite; display: none; pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #msg { z-index: 6; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; background: rgba(0,0,0,.7); }
  #msg a { color: var(--on-accent); background: var(--accent); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; text-decoration: none; }
  svg { display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="clip"><div id="yt"></div></div>
  <div id="veil" class="layer"><img class="bg" alt=""></div>
  <div id="cover" class="layer"><img class="bg" alt=""><div class="shade"></div>
    <div class="start"><span class="disc"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"/></svg></span><b id="watch"></b></div>
  </div>
  <div id="blocker" class="layer"></div>
  <div id="spin"></div>
  <div id="ui" class="layer">
    <button id="center" class="hit" type="button" aria-label="Play"></button>
    <div id="bar" class="hit">
      <button id="pp" class="btn" type="button" aria-label="Play"></button>
      <span id="time">0:00 / 0:00</span>
      <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek">
      <button id="mute" class="btn" type="button" aria-label="Mute"></button>
      <button id="fs" class="btn" type="button" aria-label="Full screen"></button>
    </div>
  </div>
  <div id="msg" class="layer"><span id="msgText"></span><a id="msgLink" target="_blank" rel="noopener"></a></div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search)
  var id = q.get('v') || ''
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) id = ''
  var start = Math.max(0, parseInt(q.get('t') || '0', 10) || 0)
  var auto = q.get('autoplay') === '1'
  var land = q.get('land') === '1'
  var ar = q.get('lang') !== 'en'
  var T = function (a, e) { return ar ? a : e }
  var inApp = !!window.ReactNativeWebView
  document.documentElement.dir = ar ? 'rtl' : 'ltr'
  document.documentElement.lang = ar ? 'ar' : 'en'

  var $ = function (s) { return document.getElementById(s) }
  var stage = $('stage'), clip = $('clip'), cover = $('cover'), veil = $('veil'), blocker = $('blocker'), ui = $('ui'), spin = $('spin')
  var seek = $('seek'), time = $('time')
  $('watch').textContent = T('شاهد العمل', 'Watch')

  var ICON = {
    play: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M7 4.5v15L20 12z" fill="currentColor"/></svg>',
    pause: '<svg width="22" height="22" viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor"/></svg>',
    replay: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>',
    vol: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
    muted: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',
    full: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>',
    exit: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>'
  }

  // Frame from the video for the cover and the pause veil (full size first, smaller one if missing).
  var imgs = document.querySelectorAll('img.bg')
  imgs.forEach(function (im) {
    im.onerror = function () { if (im.src.indexOf('hqdefault') < 0) im.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg' }
    if (id) im.src = 'https://i.ytimg.com/vi/' + id + '/maxresdefault.jpg'
  })

  function post(msg) {
    try { if (inApp) window.ReactNativeWebView.postMessage(JSON.stringify(msg)) } catch (e) {}
    try { if (window.parent !== window) window.parent.postMessage(Object.assign({ mk: 'player' }, msg), '*') } catch (e) {}
  }

  var fakeFs = false
  function inFs() { return land || fakeFs || !!(document.fullscreenElement || document.webkitFullscreenElement) }

  function layout() {
    var w = window.innerWidth, h = window.innerHeight
    // Full screen in the app is always landscape: turn the stage when the phone is held upright.
    if (land && h > w) {
      stage.style.width = h + 'px'; stage.style.height = w + 'px'
      stage.style.transform = 'translate(' + w + 'px,0) rotate(90deg)'
      var t = w; w = h; h = t
    } else {
      stage.style.width = '100%'; stage.style.height = '100%'; stage.style.transform = ''
    }
    var vw = Math.min(w, h * 16 / 9), vh = vw * 9 / 16
    var off = Math.max(90, Math.round(vh * 0.35))
    clip.style.left = (w - vw) / 2 + 'px'; clip.style.top = (h - vh) / 2 + 'px'
    clip.style.width = vw + 'px'; clip.style.height = vh + 'px'
    var f = player && player.getIframe ? player.getIframe() : $('yt')
    if (f) { f.style.width = vw + 'px'; f.style.height = (vh + off * 2) + 'px'; f.style.top = -off + 'px' }
    $('fs').innerHTML = inFs() ? ICON.exit : ICON.full
  }

  var player = null, ready = false, started = false, state = -1, dragging = false, hideTimer = 0

  function fmt(s) {
    s = Math.max(0, Math.floor(s || 0))
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0')
  }
  function paint() {
    if (!ready) return
    var d = player.getDuration() || 0, c = dragging ? Number(seek.value) : player.getCurrentTime() || 0
    seek.max = String(d || 100)
    if (!dragging) seek.value = String(c)
    seek.style.setProperty('--p', (d ? (c / d) * 100 : 0) + '%')
    time.textContent = fmt(c) + ' / ' + fmt(d)
  }
  function icons() {
    var playing = state === 1 || state === 3
    var icon = state === 0 ? ICON.replay : playing ? ICON.pause : ICON.play
    $('center').innerHTML = icon
    $('pp').innerHTML = state === 0 ? ICON.replay : playing ? ICON.pause : ICON.play
    $('center').setAttribute('aria-label', playing ? T('إيقاف مؤقت', 'Pause') : T('تشغيل', 'Play'))
    $('mute').innerHTML = ready && player.isMuted() ? ICON.muted : ICON.vol
  }
  function showUi(stay) {
    ui.classList.add('on')
    clearTimeout(hideTimer)
    if (!stay && state === 1) hideTimer = setTimeout(function () { ui.classList.remove('on') }, 2800)
  }
  function toggle() {
    if (!ready) return
    if (state === 0) { player.seekTo(0, true); player.playVideo() }
    else if (state === 1 || state === 3) player.pauseVideo()
    else player.playVideo()
  }

  function onState(e) {
    state = e.data
    spin.style.display = state === 3 ? 'block' : 'none'
    if (state === 1 && !started) {
      started = true
      cover.style.opacity = '0'
      blocker.style.display = 'block'
      post({ type: 'play' })
    }
    // Paused or finished: the blurred frame hides YouTube's pause shelf and end screen.
    veil.classList.toggle('on', started && (state === 2 || state === 0))
    if (started) showUi(state !== 1)
    icons()
  }
  function onError(e) {
    // 101 and 150: the owner does not allow playback outside YouTube.
    var url = 'https://www.youtube.com/watch?v=' + id + (start ? '&t=' + start + 's' : '')
    $('msgText').textContent = T('صاحب هذا الفيديو لا يسمح بعرضه خارج يوتيوب.', 'The owner of this video does not allow it to play outside YouTube.')
    var a = $('msgLink'); a.textContent = T('افتح الفيديو', 'Open the video'); a.href = url
    a.onclick = function (ev) { if (inApp) { ev.preventDefault(); post({ type: 'open', url: url }) } }
    $('msg').style.display = 'flex'
    cover.style.opacity = '0'
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('yt', {
      host: 'https://www.youtube-nocookie.com',
      videoId: id,
      width: '100%', height: '100%',
      playerVars: { controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3, playsinline: 1, modestbranding: 1, cc_load_policy: 0, start: start, origin: location.origin },
      events: {
        onReady: function () {
          ready = true
          layout(); icons(); paint()
          if (auto) player.playVideo()
          post({ type: 'ready' })
        },
        onStateChange: onState,
        onError: onError
      }
    })
  }

  blocker.addEventListener('click', function () {
    if (ui.classList.contains('on') && state === 1) { ui.classList.remove('on'); clearTimeout(hideTimer) }
    else showUi(state !== 1)
  })
  $('center').addEventListener('click', function (e) { e.stopPropagation(); toggle(); showUi() })
  $('pp').addEventListener('click', function (e) { e.stopPropagation(); toggle(); showUi() })
  $('mute').addEventListener('click', function (e) {
    e.stopPropagation()
    if (!ready) return
    if (player.isMuted()) player.unMute(); else player.mute()
    setTimeout(icons, 50); showUi()
  })
  seek.addEventListener('input', function () { dragging = true; paint(); showUi(true) })
  seek.addEventListener('change', function () { player.seekTo(Number(seek.value), true); dragging = false; showUi() })
  $('fs').addEventListener('click', function (e) {
    e.stopPropagation()
    var t = ready ? player.getCurrentTime() : start
    if (inApp) {
      // The app shows full screen in its own window, turned to landscape.
      if (ready && !land) player.pauseVideo()
      post({ type: land ? 'exitFullscreen' : 'fullscreen', t: t })
      return
    }
    var el = document.documentElement
    var native = document.fullscreenEnabled || document.webkitFullscreenEnabled
    if (native) {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document)
      else {
        var p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el)
        if (p && p.then) p.then(function () { try { screen.orientation.lock('landscape').catch(function () {}) } catch (x) {} }).catch(function () {})
      }
    } else {
      // iPhone Safari cannot make a page element full screen: the page around us fills the screen instead.
      fakeFs = !fakeFs
      post({ type: 'fullscreen', on: fakeFs })
    }
    setTimeout(layout, 60)
  })

  // Controls for the app (it injects calls like mkPlayer.seek(42)).
  window.mkPlayer = {
    seek: function (t) { if (ready) player.seekTo(Math.max(0, Number(t) || 0), true) },
    play: function () { if (ready) player.playVideo() },
    pause: function () { if (ready) player.pauseVideo() },
    time: function () { return ready ? player.getCurrentTime() : 0 }
  }
  window.addEventListener('message', function (e) {
    var d = e.data
    if (d && d.mk === 'player-cmd') {
      if (d.cmd === 'fsOff') { fakeFs = false; setTimeout(layout, 60) }
      if (d.cmd === 'pause') window.mkPlayer.pause()
    }
  })

  window.addEventListener('resize', layout)
  document.addEventListener('fullscreenchange', layout)
  document.addEventListener('webkitfullscreenchange', layout)
  setInterval(function () { if (state === 1 || dragging) paint() }, 250)
  layout(); icons()

  if (!id) { onError(); return }
  var s = document.createElement('script')
  s.src = 'https://www.youtube.com/iframe_api'
  document.head.appendChild(s)
})()
</script>
</body>
</html>
